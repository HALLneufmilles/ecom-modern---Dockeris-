services:
  # Service pour le développement
  server-dev:
    build:
      context: .
      target: dev
    environment:
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://medusa:9000}
      MEDUSA_PUBLISHABLE_API_KEY: ${MEDUSA_PUBLISHABLE_API_KEY:-}
    ports:
      - 5000:5000
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

  # Service pour la production
  server-prod:
    build:
      context: .
      target: prod
    environment:
      NODE_ENV: production
    ports:
      - 5001:5000
    env_file:
      - .env

      # Base de données PostgreSQL pour Medusa
  postgres:
    image: postgres:15-alpine
    container_name: ecom-modern-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 10s
      timeout: 5s
      retries:
        5

        # Backend e-commerce Medusa
  medusa:
    build:
      context: ./medusa
    container_name: ecom-modern-medusa
    ports:
      - "9000:9000"
      - "5173:5173"
    env_file:
      - ./medusa/apps/backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
