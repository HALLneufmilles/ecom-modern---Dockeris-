<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clothing : Order confirmation</title>
    <link rel="stylesheet" href="/css/homesliders.css" />
    <link rel="stylesheet" href="/css/order.css" />
  </head>
  <body>
    <nav class="navbar"></nav>
    <main class="order-confirmation">
      <p class="order-kicker">payment accepted</p>
      <h1>Thank you for your order</h1>
      <p class="order-reference"></p>
      <dl class="order-status"></dl>
      <section>
        <h2>Order summary</h2>
        <div class="order-items"></div>
        <p class="order-total"></p>
      </section>
      <a class="continue-shopping" href="/">continue shopping</a>
    </main>
    <script src="/js/nav.js"></script>
    <script src="/js/order.js"></script>
  </body>
</html>
